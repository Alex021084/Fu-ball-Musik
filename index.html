<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070a"><title>FC Ostereistedt-Rhade · Fußball Musik</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#05070a,#07100b);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}main{max-width:1180px;margin:auto;padding:18px}.head{display:grid;grid-template-columns:150px 1fr 120px;align-items:center;gap:15px;padding-bottom:18px}.crest{width:125px;height:150px;margin:auto}.brand{text-align:center}.brand h1{margin:0;font-size:clamp(30px,5vw,55px);font-weight:950}.brand h1 span{color:#28e653}.brand h2{margin:7px 0;font-size:clamp(15px,2vw,23px)}.line{height:6px;max-width:350px;margin:auto;background:linear-gradient(90deg,#00a51a 0 38%,#fff 38% 62%,#e00000 62%)}.slogan{text-align:center;font-size:19px;font-weight:900;font-style:italic}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.sound,.stop{border:2px solid #ffffff30;color:#fff;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 7px 18px #0007}.sound{min-height:145px;border-radius:20px;font-size:clamp(18px,2.2vw,28px);padding:12px}.track{display:block;font-size:13px;font-weight:600;margin-top:9px;opacity:.9}.c1{background:#e00000}.c2{background:#075ee8}.c3{background:#08b83b}.c4{background:#ed6800}.c5{background:#8c14df}.c6{background:#ead000;color:#111}.c7{background:#08b8d2;color:#062027}.c8{background:#e71888}.c9{background:#087b32}.c10{background:#571ee0}.c11{background:#dca900;color:#111}.c12{background:#075ee8}.stop{width:100%;min-height:95px;margin-top:15px;border-radius:20px;background:#d80000;font-size:34px}.status{text-align:center;color:#b9c0c8;min-height:24px;margin-top:12px}@media(max-width:800px){.head{grid-template-columns:75px 1fr 25px}.crest{width:65px;height:80px}.slogan{display:none}.grid{grid-template-columns:repeat(2,1fr)}.sound{min-height:120px}.stop{min-height:75px;font-size:28px}}</style></head><body><main>
<header class="head"><img class="crest" src="crest.svg" alt="FC Ostereistedt-Rhade Wappen"><div class="brand"><h1>FUSSBALL <span>MUSIK</span></h1><h2>FC Ostereistedt-Rhade</h2><div class="line"></div></div><div class="slogan">EIN VEREIN.<br>EINE REGION.</div></header>
<section class="grid" id="grid"></section><button class="stop" id="stop">STOP</button><div class="status" id="status">Bereit für das nächste Tor</div><audio id="audio" preload="auto"></audio>
<script>
const data=[["TOR","Test: tor.mp3","c1","tor.mp3"],["TORHYMNE","Noch kein Sound","c2"],["FANGESANG","Noch kein Sound","c3"],["HYPE","Noch kein Sound","c4"],["SIEG","Noch kein Sound","c5"],["AUF GEHT'S","Noch kein Sound","c6"],["NUR DER VEREIN","Noch kein Sound","c7"],["WIR SIND EIN TEAM","Noch kein Sound","c8"],["GEMEINSAM STARK","Noch kein Sound","c9"],["KÄMPFEN UND SIEGEN","Noch kein Sound","c10"],["FUSSBALL LEIDENSCHAFT","Noch kein Sound","c11"],["IMMER WEITER","Noch kein Sound","c12"]];
const grid=document.querySelector("#grid"),audio=document.querySelector("#audio"),status=document.querySelector("#status");
data.forEach(x=>{const b=document.createElement("button");b.className="sound "+x[2];b.innerHTML=x[0]+'<span class="track">'+x[1]+"</span>";b.onclick=()=>{if(!x[3]){status.textContent=x[0]+": Noch kein Sound hinterlegt";return}audio.pause();audio.currentTime=0;audio.src=x[3];audio.play().then(()=>status.textContent=x[0]+" läuft ▶").catch(()=>status.textContent="Bitte erneut tippen.")};grid.appendChild(b)});
document.querySelector("#stop").onclick=()=>{audio.pause();audio.currentTime=0;status.textContent="Musik gestoppt ⏹"};
</script></main></body></html>
