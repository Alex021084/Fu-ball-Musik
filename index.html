<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FC Ostereistedt-Rhade – Stadion Soundboard</title>
<style>
*{box-sizing:border-box}
:root{--g:#12d83d;--r:#f01414;--w:#fff;--panel:rgba(5,15,22,.93)}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#fff;background:#02080b}
body{
 background:
 radial-gradient(circle at 50% 7%,rgba(80,150,210,.22),transparent 30%),
 linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.72)),
 linear-gradient(180deg,#07131e 0 40%,#102016 75%,#06220e 100%);
 overflow-x:hidden
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:
 radial-gradient(circle at 5% 8%,#fff 0 2px,transparent 4px),
 radial-gradient(circle at 8% 12%,#fff 0 2px,transparent 5px),
 radial-gradient(circle at 95% 8%,#fff 0 2px,transparent 4px),
 radial-gradient(circle at 92% 12%,#fff 0 2px,transparent 5px),
 linear-gradient(115deg,transparent 0 11%,rgba(255,255,255,.08) 12%,transparent 14%),
 linear-gradient(65deg,transparent 0 86%,rgba(255,255,255,.08) 88%,transparent 90%);
opacity:.75}
.app{max-width:1260px;margin:auto;padding:12px 18px 28px;position:relative}
.top{
 display:grid;grid-template-columns:1fr 420px 1fr;align-items:center;gap:20px;
 min-height:250px
}
.slogan{font-weight:1000;font-size:31px;line-height:1.03;font-style:italic;text-shadow:0 4px 5px #000}
.slogan .mark{height:7px;width:190px;background:var(--g);transform:skew(-24deg);margin-top:15px;box-shadow:0 0 12px rgba(18,216,61,.6)}
.slogan.right{text-align:right}.slogan.right .mark{margin-left:auto;background:linear-gradient(90deg,var(--g),#fff 48%,var(--r))}
.center{text-align:center}
.crest{width:190px;height:190px;object-fit:contain;display:block;margin:auto;filter:drop-shadow(0 8px 9px #000) drop-shadow(0 0 14px rgba(255,255,255,.18))}
.club{font-size:29px;font-weight:1000;letter-spacing:.5px;text-shadow:0 3px 0 #000}
.club b{font-size:40px}.bar{height:8px;max-width:330px;margin:9px auto;background:linear-gradient(90deg,var(--g) 0 33%,#fff 33% 66%,var(--r) 66%)}
.sub{font-size:15px;letter-spacing:6px;margin-top:9px;font-weight:800;text-shadow:0 2px 3px #000}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:5px}
.card{min-width:0;border-radius:15px;overflow:hidden;box-shadow:0 8px 16px rgba(0,0,0,.7)}
.sound{
 width:100%;min-height:91px;border:2px solid rgba(255,255,255,.26);border-radius:15px 15px 0 0;
 display:grid;grid-template-columns:60px 1fr;align-items:center;color:#fff;font-weight:1000;
 cursor:pointer;text-shadow:0 3px 3px rgba(0,0,0,.65);box-shadow:inset 0 2px 0 rgba(255,255,255,.2)
}
.sound:active{filter:brightness(1.15);transform:scale(.99)}
.icon{font-size:39px;text-align:center}.label{font-size:28px;line-height:1.02;text-align:left;padding-right:9px}
.song{display:block;font-size:15px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{background:linear-gradient(#142a38,#071119);padding:7px;border:1px solid #405868;border-top:0}
.assign{width:100%;height:34px;background:#0d1d28;color:#fff;border:1px solid #506879;border-radius:7px;text-align:left;font-size:14px;font-weight:800;padding:0 9px;cursor:pointer}
.assign span{float:right;font-size:21px;line-height:15px}
.meta{display:grid;grid-template-columns:1fr 1fr 34px;gap:5px;align-items:center;margin-top:6px;font-size:12px;font-weight:800}
.t{background:#061018;border:1px solid #435968;border-radius:6px;padding:6px 4px;text-align:center}.edit{height:29px;background:#132532;color:#fff;border:1px solid #566d7c;border-radius:6px;cursor:pointer}
.stop{width:100%;margin-top:13px;min-height:85px;border-radius:17px;border:3px solid #ff6767;background:linear-gradient(#ff1717,#b60000);color:#fff;font-weight:1000;box-shadow:inset 0 3px rgba(255,255,255,.17),0 7px 17px #000;cursor:pointer}
.stop-main{font-size:44px;line-height:1}.stop-sub{font-size:13px;margin-top:4px}
.bottom{
 display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr 1fr;gap:8px;align-items:center;
 margin-top:13px;padding:10px 12px;background:rgba(0,0,0,.72);border:1px solid #263d48;border-radius:13px
}
.bottom button{background:transparent;color:#fff;border:0;font-size:12px;font-weight:800;cursor:pointer;padding:7px}
.bottom b{font-size:18px;display:block;margin-bottom:2px}.bottom .clubmini{text-align:center;letter-spacing:3px}.mini-bar{height:4px;background:linear-gradient(90deg,var(--g) 0 33%,#fff 33% 66%,var(--r) 66%);margin-top:5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.76);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}
.dialog{width:min(520px,100%);background:#091721;border:1px solid #4d6878;border-radius:18px;padding:18px;box-shadow:0 20px 70px #000}
.dialog h2{margin:0 0 12px}.choices{display:flex;gap:8px}.choices button,.actions button{flex:1;padding:11px;border-radius:8px;border:1px solid #526b7b;background:#152834;color:#fff;font-weight:800}
.dialog label{display:block;font-size:13px;font-weight:800;margin-top:10px}.dialog input{width:100%;margin-top:5px;padding:9px;background:#061018;color:#fff;border:1px solid #506879;border-radius:7px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:8px;margin-top:15px}.actions .save{background:var(--g);color:#001b05;border:0}.actions .cancel{background:#3a4c58}.note{font-size:12px;color:#b9c6cc;line-height:1.4;margin-top:10px}
.c1{background:linear-gradient(135deg,#ff1717,#bf0000)}.c2{background:linear-gradient(135deg,#0879ff,#0348b7)}
.c3{background:linear-gradient(135deg,#10d83d,#008c27)}.c4{background:linear-gradient(135deg,#ff8900,#df5d00)}
.c5{background:linear-gradient(135deg,#c300ff,#6500d8)}.c6{background:linear-gradient(135deg,#ffe900,#dfc700);color:#07100b;text-shadow:none}
.c7{background:linear-gradient(135deg,#16d8eb,#009fb6);color:#061016;text-shadow:none}.c8{background:linear-gradient(135deg,#ff20a5,#d50678)}
.c9{background:linear-gradient(135deg,#0fd24a,#008b29)}.c10{background:linear-gradient(135deg,#8f00ff,#4d00d5)}
.c11{background:linear-gradient(135deg,#ffe800,#d9bd00);color:#07100b;text-shadow:none}.c12{background:linear-gradient(135deg,#0879ff,#0646bd)}
@media(max-width:900px){
 .app{padding:8px}.top{grid-template-columns:1fr;min-height:190px}.slogan{display:none}.crest{width:130px;height:130px}.club{font-size:22px}.club b{font-size:31px}
 .grid{grid-template-columns:repeat(2,1fr);gap:10px}.label{font-size:22px}.icon{font-size:31px}.bottom{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.label{font-size:18px}.sound{grid-template-columns:42px 1fr;min-height:84px}.icon{font-size:26px}.song{font-size:12px}.meta{font-size:11px}.stop-main{font-size:35px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="slogan">EIN VEREIN.<br>EINE REGION.<br>EINE FAMILIE.<div class="mark"></div></div>
 <div class="center"><img src="crest-exact.png" class="crest" alt="FC Ostereistedt-Rhade"><div class="club"><b>FC</b> OSTEREISTEDT-RHADE</div><div class="bar"></div><div class="sub">MEHR ALS EIN SPIEL.</div></div>
 <div class="slogan right">GEMEINSAM<br>STARK!<div class="mark"></div></div>
</header>
<div id="grid" class="grid"></div>
<button class="stop" onclick="stopAll()"><div class="stop-main">■ &nbsp; STOP</div><div class="stop-sub">ALLE SOUNDS BEENDEN</div></button>
<div class="bottom">
 <button onclick="alert('Einstellungen folgen in der nächsten Version.')"><b>⚙</b>Einstellungen</button>
 <button onclick="alert('Hier können wir später alle Sounds verwalten.')"><b>▰</b>Sounds verwalten</button>
 <div class="clubmini">FC OSTEREISTEDT-RHADE<div class="mini-bar"></div></div>
 <button onclick="saveConfig()"><b>▣</b>Konfiguration speichern</button>
 <button onclick="loadConfig()"><b>↻</b>Konfiguration laden</button>
</div>
</div>
<div id="modal" class="modal"><div class="dialog"><h2 id="mh">Lied zuordnen</h2><div class="choices"><button onclick="fileForm()">📁 Audiodatei</button><button onclick="appleInfo()"> Apple Music</button></div><div id="form"></div><div class="actions"><button class="cancel" onclick="closeModal()">Abbrechen</button><button class="save" onclick="save()">Speichern</button></div></div></div>
<script>
const labels=["TOR","TORHYMNE","FANGESANG","HYPE","SIEG","AUF GEHT’S","NUR DER VEREIN","WIR SIND EIN TEAM","GEMEINSAM STARK","KÄMPFEN UND SIEGEN","FUSSBALL LEIDENSCHAFT","IMMER WEITER"];
const icons=["⚽","🔥","👥","🔥","🏆","💪","👥","♥","👥","⚔","⚽","▮▮▮"];
const colors=["c1","c2","c3","c4","c5","c6","c7","c8","c9","c10","c11","c12"];
let slots=JSON.parse(localStorage.getItem("fcSoundboard")||"null")||labels.map(()=>({song:"Noch kein Lied",start:0,end:0,src:null}));
let current=-1,audio=null;
function esc(s){return String(s).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
function time(v){v=Math.max(0,Number(v)||0);return String(Math.floor(v/60)).padStart(2,"0")+":"+String(Math.floor(v%60)).padStart(2,"0")}
function render(){let g=document.getElementById("grid");g.innerHTML=labels.map((x,i)=>{let d=slots[i];return `<div class="card"><button class="sound ${colors[i]}" onclick="play(${i})"><div class="icon">${icons[i]}</div><div class="label">${x}<span class="song">${esc(d.song)}</span></div></button><div class="controls"><button class="assign" onclick="openModal(${i})">♫ &nbsp; Lied zuordnen <span>›</span></button><div class="meta"><div>Start: <span class="t">${time(d.start)}</span></div><div>Ende: <span class="t">${time(d.end)}</span></div><button class="edit" onclick="openModal(${i})">✎</button></div></div></div>`}).join("")}
function openModal(i){current=i;document.getElementById("mh").textContent=labels[i]+" – Lied zuordnen";document.getElementById("modal").classList.add("open");fileForm()}
function closeModal(){document.getElementById("modal").classList.remove("open");current=-1}
function fileForm(){let d=slots[current]||{};document.getElementById("form").innerHTML=`<label>Audiodatei</label><input id="file" type="file" accept="audio/*"><label>Name auf der Taste</label><input id="name" value="${esc(d.song==="Noch kein Lied"?"":d.song)}" placeholder="z. B. Torhymne.mp3"><div class="row"><label>Start in Sekunden<input id="start" type="number" min="0" step=".1" value="${d.start||0}"></label><label>Ende in Sekunden<input id="end" type="number" min="0" step=".1" value="${d.end||0}"></label></div><div class="note">Lokale Dateien funktionieren direkt im Browser. Apple Music wird später in der nativen iPad-Version mit MusicKit angebunden.</div>`}
function appleInfo(){document.getElementById("form").innerHTML=`<div class="note" style="font-size:15px;padding:15px 0"><b> Apple Music</b><br><br>Die Apple-Music-Auswahl kommt in die native iPad-App. Dort bauen wir die MusicKit-Anbindung ein. Die GitHub-Pages-Version kann keine offline gespeicherten Apple-Music-Dateien als freie MP3-Dateien auslesen.</div>`}
function save(){let f=document.getElementById("file");let n=document.getElementById("name");if(f&&f.files[0]){slots[current].src=URL.createObjectURL(f.files[0]);slots[current].song=n.value||f.files[0].name}else if(n){slots[current].song=n.value||"Noch kein Lied"}slots[current].start=Number(document.getElementById("start")?.value)||0;slots[current].end=Number(document.getElementById("end")?.value)||0;localStorage.setItem("fcSoundboard",JSON.stringify(slots));closeModal();render()}
function play(i){stopAll();let d=slots[i];if(!d.src){alert("Für diese Taste ist noch kein Sound zugeordnet.");return}audio=new Audio(d.src);audio.currentTime=Number(d.start)||0;audio.play();audio.ontimeupdate=()=>{if(d.end>0&&audio.currentTime>=d.end)stopAll()};audio.onended=()=>audio=null}
function stopAll(){if(audio){audio.pause();audio.currentTime=0;audio=null}}
function saveConfig(){let blob=new Blob([JSON.stringify(slots)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="FC-Ostereistedt-Rhade-Konfiguration.json";a.click()}
function loadConfig(){let i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{slots=JSON.parse(r.result);localStorage.setItem("fcSoundboard",JSON.stringify(slots));render()}catch(e){alert("Konfiguration konnte nicht geladen werden.")}};r.readAsText(i.files[0])};i.click()}
render();
</script>
</body>
</html>
