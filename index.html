<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Fußball Musik</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:#fff;background:#0b0d10}
*{box-sizing:border-box}body{margin:0;background:#0b0d10}main{max-width:1100px;margin:auto;padding:20px}
header{display:flex;align-items:center;gap:16px;margin-bottom:18px}.brand{flex:1}
h1{margin:0;font-size:clamp(28px,5vw,46px);font-weight:900} .status{color:#9da4ad;margin-top:4px}
button{font:inherit;color:#fff;border:0;border-radius:22px;min-height:58px;padding:14px 18px;font-weight:800;cursor:pointer}
.stop{background:#252a31;border:1px solid #3a414b}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sound{background:#191d23;min-height:170px;font-size:22px;border:1px solid #2b3139;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}
.sound.goal{background:#1e9b51;min-height:220px;font-size:32px}
.sound small{font-size:13px;color:#aeb5be;font-weight:600}
.panel{margin-top:18px;background:#15191e;border:1px solid #292f37;border-radius:22px;padding:18px}
.panel h2{margin:0 0 12px;font-size:21px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;color:#b8bec7;font-size:14px;font-weight:700;margin-bottom:7px}
input[type=file],input[type=number]{width:100%;padding:12px;border-radius:12px;border:1px solid #3a414b;background:#0e1115;color:#fff}
input[type=range]{width:100%}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.actions button{background:#2b3139}
.note{color:#9da4ad;font-size:13px;line-height:1.45}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.sound{min-height:145px}.sound.goal{min-height:180px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header>
  <div class="brand">
    <h1>⚽ FUßBALL MUSIK</h1>
    <div class="status" id="status">Bereit für das nächste Tor</div>
  </div>
  <button class="stop" id="stop">⏹ Stop</button>
</header>

<section class="grid" id="buttons"></section>

<section class="panel">
  <h2>Sounds einrichten</h2>
  <div class="row">
    <div>
      <label for="slot">Button</label>
      <select id="slot" style="width:100%;padding:12px;border-radius:12px;background:#0e1115;color:white;border:1px solid #3a414b">
        <option value="goal">⚽ TOR</option><option value="hymn">🏆 TORHYMNE</option>
        <option value="fans">📣 FANGESANG</option><option value="hype">🔥 HYPE</option>
        <option value="win">🏁 SIEG</option>
      </select>
    </div>
    <div>
      <label for="audioFile">Audiodatei</label>
      <input id="audioFile" type="file" accept="audio/*">
    </div>
  </div>
  <div class="row" style="margin-top:12px">
    <div><label>Start (Sekunden)</label><input id="start" type="number" min="0" step="0.1" value="0"></div>
    <div><label>Ende (Sekunden, 0 = bis Ende)</label><input id="end" type="number" min="0" step="0.1" value="0"></div>
  </div>
  <div style="margin-top:12px">
    <label>Lautstärke</label><input id="volume" type="range" min="0" max="1" step="0.01" value="1">
  </div>
  <div class="actions">
    <button id="save">💾 Sound übernehmen</button>
    <button id="preview">▶ Vorschau</button>
  </div>
  <p class="note">Die Audiodatei wird nur in deinem Browser verwendet. Für die Nutzung auf dem Fußballplatz kannst du eigene, rechtmäßig verwendete Audiodateien auswählen.</p>
</section>

<audio id="player" preload="auto"></audio>

<script>
const defs={
 goal:{title:"TOR",icon:"⚽",file:null,start:0,end:0,volume:1},
 hymn:{title:"TORHYMNE",icon:"🏆",file:null,start:0,end:0,volume:1},
 fans:{title:"FANGESANG",icon:"📣",file:null,start:0,end:0,volume:1},
 hype:{title:"HYPE",icon:"🔥",file:null,start:0,end:0,volume:1},
 win:{title:"SIEG",icon:"🏁",file:null,start:0,end:0,volume:1}
};
const labels={goal:"TOR",hymn:"TORHYMNE",fans:"FANGESANG",hype:"HYPE",win:"SIEG"};
const buttons=document.querySelector("#buttons"),player=document.querySelector("#player"),status=document.querySelector("#status");
const slot=document.querySelector("#slot"),fileInput=document.querySelector("#audioFile"),start=document.querySelector("#start"),end=document.querySelector("#end"),volume=document.querySelector("#volume");
let current=null, objectUrls=[];
function render(){
 buttons.innerHTML="";
 for(const key of Object.keys(defs)){
  const d=defs[key], b=document.createElement("button");
  b.className="sound"+(key==="goal"?" goal":"");
  b.innerHTML=`<span>${d.icon}</span><span>${d.title}</span><small>${d.file?"Sound geladen":"noch kein Sound"}</small>`;
  b.onclick=()=>play(key); buttons.appendChild(b);
 }
}
function setStatus(t){status.textContent=t}
function play(key){
 const d=defs[key];
 if(!d.file){setStatus(`${d.title}: zuerst einen Sound auswählen`);return}
 player.pause(); player.src=d.file; player.volume=d.volume;
 player.currentTime=Math.max(0,d.start||0);
 player.play().then(()=>setStatus(`${d.title} läuft ▶`)).catch(()=>setStatus("Wiedergabe wurde vom Browser blockiert – bitte erneut tippen."));
 current=key;
}
player.ontimeupdate=()=>{if(current&&defs[current].end>0&&player.currentTime>=defs[current].end){player.pause();player.currentTime=defs[current].start||0;setStatus(`${defs[current].title} fertig`)}};
document.querySelector("#stop").onclick=()=>{player.pause();player.currentTime=0;setStatus("Gestoppt ⏹")};
slot.onchange=()=>loadForm();
function loadForm(){const d=defs[slot.value];start.value=d.start;end.value=d.end;volume.value=d.volume}
fileInput.onchange=()=>{const f=fileInput.files[0];if(!f)return;const url=URL.createObjectURL(f);objectUrls.push(url);defs[slot.value].file=url;setStatus(`${labels[slot.value]}: ${f.name}`);render()};
document.querySelector("#save").onclick=()=>{const d=defs[slot.value];d.start=Math.max(0,Number(start.value)||0);d.end=Math.max(0,Number(end.value)||0);d.volume=Math.min(1,Math.max(0,Number(volume.value)||0));setStatus(`${d.title} gespeichert`);render()};
document.querySelector("#preview").onclick=()=>{const key=slot.value;const d=defs[key];d.start=Math.max(0,Number(start.value)||0);d.end=Math.max(0,Number(end.value)||0);d.volume=Math.min(1,Math.max(0,Number(volume.value)||0));play(key)};
render();loadForm();
</script>
</main>
</body>
</html>
